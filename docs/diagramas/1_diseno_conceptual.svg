family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#17312c" text-anchor="end">1</text><text x="1010" y="268" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#17312c" text-anchor="start">1..*</text><text x="1065" y="312" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#5b6b66" text-anchor="middle" font-style="italic">contiene</text><text x="800" y="70" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="36" font-weight="700" fill="#17312c" text-anchor="middle">Diseño conceptual — clases del dominio</text><text x="800" y="112" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#5b6b66" text-anchor="middle">Un pedido agrupa uno o más detalles; cada detalle referencia un producto existente</text><rect x="70" y="486" width="1460" height="48" rx="8" fill="#e3efe8" stroke="none" stroke-width="2"/><text x="95" y="517" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#155c48" text-anchor="start">Comprador</text><text x="330" y="517" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17312c" text-anchor="start">nombre y correo son atributos del Pedido: sin tabla de usuarios ni cuentas.</text><rect x="70" y="544" width="1460" height="48" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="95" y="575" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#155c48" text-anchor="start">precio_unitario</text><text x="330" y="575" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17312c" text-anchor="start">copia el precio de SQLite en el momento de la compra (histórico).</text><rect x="70" y="602" width="1460" height="48" rx="8" fill="#e3efe8" stroke="none" stroke-width="2"/><text x="95" y="633" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#155c48" text-anchor="start">subtotal / total</text><text x="330" y="633" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17312c" text-anchor="start">los calcula el servidor; nunca se toman del navegador.</text><rect x="70" y="660" width="1460" height="48" rx="8" fill="#ffffff" stroke="none" stroke-width="2"/><text x="95" y="691" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#155c48" text-anchor="start">Repetidos</text><text x="330" y="691" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17312c" text-anchor="start">si un producto llega dos veces en items, se agrupa sumando cantidades.</text>
