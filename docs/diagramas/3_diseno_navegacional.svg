nt-size="18" font-weight="400" fill="#5b6b66" text-anchor="middle">en /carrito</text><rect x="1230" y="180" width="310" height="150" rx="18" fill="#ffffff" stroke="#155c48" stroke-width="3"/><text x="1385" y="238" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#155c48" text-anchor="middle">Pedidos</text><text x="1385" y="274" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#17312c" text-anchor="middle">Consulta del historial</text><text x="1385" y="308" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="18" font-weight="400" fill="#5b6b66" text-anchor="middle">GET /pedidos</text><line x1="374" y1="255" x2="444" y2="255" stroke="#155c48" stroke-width="3.5" marker-end="url(#flechaV)"/><text x="410" y="158" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#17312c" text-anchor="middle">Agregar al carrito</text><text x="410" y="390" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b66" text-anchor="middle">Se conserva:</text><rect x="283.625" y="411" width="252.75" height="33" rx="8" fill="#fbefd9" stroke="#cf8a18" stroke-width="1.5"/><text x="410" y="433" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="400" fill="#17312c" text-anchor="middle">{ producto_id, cantidad }</text><text x="410" y="480" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#cf8a18" text-anchor="middle">localStorage</text><line x1="764" y1="255" x2="834" y2="255" stroke="#155c48" stroke-width="3.5" marker-end="url(#flechaV)"/><text x="800" y="158" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#17312c" text-anchor="middle">Registrar pedido</text><text x="800" y="390" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" 