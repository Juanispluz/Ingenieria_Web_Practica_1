ion Sans, DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#5b6b66" text-anchor="start">Regresos: carrito vacío → "Ir al catálogo"   ·   confirmación → "Seguir comprando" / "Ver pedidos"</text>
