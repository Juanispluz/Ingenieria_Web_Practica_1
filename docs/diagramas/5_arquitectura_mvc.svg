<rect width="1600" height="900" fill="#ffffff"/>
<text x="800" y="58" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#17312c" text-anchor="middle">Arquitectura — MVC organizado en capas (un solo proceso Node.js)</text><rect x="70" y="100" width="1460" height="84" rx="12" fill="#fbefd9" stroke="#cf8a18" stroke-width="2"/><text x="100" y="154" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Navegador</text><text x="360" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">views/*.html · public/*.js · styles.css</text><text x="360" y="170" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">Interfaz, fetch, carrito en localStorage</text><line x1="1440" y1="186" x2="1440" y2="212" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="214" width="1460" height="84" rx="12" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="100" y="268" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Arranque</text><text x="360" y="252" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">server_rutas.js</text><text x="360" y="284" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">Crea el servidor HTTP, captura errores 500</text><line x1="1440" y1="300" x2="1440" y2="326" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="328" width="1460" height="84" rx="12" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="100" y="382" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Rutas</text><text x="360" y="366" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">routes/rutas.js</text><text x="360" y="398" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">Método + ruta → página o acción</text><line x1="1440" y1="414" x2="1440" y2="440" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="442" width="1460" height="84" rx="12" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="100" y="496" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Controladores</text><text x="360" y="480" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">controllers/productoController.js · pedidoController.js · leerJson.js</text><text x="360" y="512" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">Interpreta HTTP: 415, JSON, elige 200/201/400/404</text><line x1="1440" y1="528" x2="1440" y2="554" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="556" width="1460" height="84" rx="12" fill="#cfe5d8" stroke="#0e4132" stroke-width="2"/><text x="100" y="610" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Modelos</text><text x="360" y="594" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">models/productoModel.js · pedidoModel.js</text><text x="360" y="626" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">Reglas de negocio y cálculo del total</text><line x1="1440" y1="642" x2="1440" y2="668" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="670" width="1460" height="84" rx="12" fill="#cfe5d8" stroke="#0e4132" stroke-width="2"/><text x="100" y="724" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#17312c" text-anchor="start">Repositorios</text><text x="360" y="708" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#17312c" text-anchor="start">data/conexion.js · productoRepository.js · pedidoRepository.js</text><text x="360" y="740" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#5b6b66" text-anchor="start">SQL parametrizado + enTransaccion</text><line x1="1440" y1="756" x2="1440" y2="782" stroke="#17312c" stroke-width="1.6" marker-end="url(#flecha)"/><rect x="70" y="784" width="1460" height="84" rx="12" fill="#155c48" stroke="#0e4132" stroke-width="2"/><text x="100" y="838" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="start">SQLite</text><text x="360" y="822" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#ffffff" text-anchor="start">data/tienda.db (esquema.sql)</text><text x="360" y="854" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#cfe5d8" text-anchor="start">productos · pedidos · detalle_pedido</text>
</svg>