<rect width="1600" height="960" fill="#ffffff"/>
<text x="800" y="52" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#17312c" text-anchor="middle">Recorrido de POST /api/pedidos por las capas</text><rect x="52" y="80" width="216" height="74" rx="10" fill="#fbefd9" stroke="#cf8a18" stroke-width="2"/><text x="160" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#17312c" text-anchor="middle">Navegador</text><text x="160" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5b6b66" text-anchor="middle">carrito.js</text><line x1="160" y1="154" x2="160" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><rect x="308" y="80" width="216" height="74" rx="10" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="416" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#17312c" text-anchor="middle">Rutas</text><text x="416" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5b6b66" text-anchor="middle">rutas.js</text><line x1="416" y1="154" x2="416" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><rect x="564" y="80" width="216" height="74" rx="10" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="672" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#17312c" text-anchor="middle">Controlador</text><text x="672" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5b6b66" text-anchor="middle">pedidoController</text><line x1="672" y1="154" x2="672" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><rect x="820" y="80" width="216" height="74" rx="10" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="928" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#17312c" text-anchor="middle">Modelo</text><text x="928" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5b6b66" text-anchor="middle">pedidoModel</text><line x1="928" y1="154" x2="928" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><rect x="1076" y="80" width="216" height="74" rx="10" fill="#e3efe8" stroke="#155c48" stroke-width="2"/><text x="1184" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#17312c" text-anchor="middle">Repositorios</text><text x="1184" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#5b6b66" text-anchor="middle">data/*</text><line x1="1184" y1="154" x2="1184" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><rect x="1332" y="80" width="216" height="74" rx="10" fill="#155c48" stroke="#155c48" stroke-width="2"/><text x="1440" y="110" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">SQLite</text><text x="1440" y="138" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" font-weight="400" fill="#cfe5d8" text-anchor="middle">tienda.db</text><line x1="1440" y1="154" x2="1440" y2="920" stroke="#9fb3a9" stroke-width="2" stroke-dasharray="6 6"/><line x1="160" y1="200" x2="412" y2="200" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="174" y="188" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">POST {nombre, correo, items}</text><line x1="416" y1="255" x2="668" y2="255" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="430" y="243" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">pedidos.crear(req, res)</text><path d="M 672,300 h 46 v 22 h -40" fill="none" stroke="#17312c" stroke-width="2" marker-end="url(#flecha)"/><text x="730" y="316" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b66" text-anchor="start" font-style="italic">esJson → 415 · leerJson → 400</text><line x1="672" y1="365" x2="924" y2="365" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="686" y="353" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">crearPedido(datos)</text><path d="M 928,410 h 46 v 22 h -40" fill="none" stroke="#17312c" stroke-width="2" marker-end="url(#flecha)"/><text x="986" y="426" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b66" text-anchor="start" font-style="italic">valida nombre, correo, items</text><line x1="928" y1="475" x2="1180" y2="475" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="942" y="463" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">buscarPorId(producto_id) × n</text><line x1="1184" y1="530" x2="1436" y2="530" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="1198" y="518" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">SELECT … WHERE id = ?</text><path d="M 928,575 h 46 v 22 h -40" fill="none" stroke="#17312c" stroke-width="2" marker-end="url(#flecha)"/><text x="986" y="591" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b66" text-anchor="start" font-style="italic">subtotal = precio × cantidad; total</text><line x1="928" y1="640" x2="1180" y2="640" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="942" y="628" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">guardar(pedido)</text><line x1="1184" y1="695" x2="1436" y2="695" stroke="#17312c" stroke-width="2.5" marker-end="url(#flecha)"/><text x="1198" y="683" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#17312c" text-anchor="start">BEGIN · INSERTs · COMMIT</text><line x1="1184" y1="750" x2="932" y2="750" stroke="#155c48" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#flechaV)"/><text x="942" y="738" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#155c48" text-anchor="start">id del pedido</text><line x1="928" y1="805" x2="676" y2="805" stroke="#155c48" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#flechaV)"/><text x="686" y="793" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#155c48" text-anchor="start">{ id, fecha, total, items }</text><line x1="672" y1="860" x2="164" y2="860" stroke="#155c48" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#flechaV)"/><text x="174" y="848" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#155c48" text-anchor="start">201 JSON  /  400 {error}</text>
