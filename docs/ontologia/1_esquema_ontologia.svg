<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1100" viewBox="0 0 1840 1100">
  <title>Ontología de La Libreta — esquema</title>
  <defs>
    <marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1F2937" stroke="#1F2937" stroke-width="1"/>
    </marker>
    <marker id="hollow" viewBox="0 0 14 14" refX="12.5" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#FFFFFF" stroke="#BF9000" stroke-width="1.6"/>
    </marker>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#6B7280" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="29" font-weight="bold" fill="#0B2E4F" text-anchor="start" opacity="1">Ontología de La Libreta — esquema (TBox)</text><text x="60" y="86" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">Clases, jerarquía de subclases y propiedades. Las clases se muestran con sus atributos tipados; las flechas de objeto van del dominio al rango.</text><rect x="1080" y="120" width="300" height="70" rx="2" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/><text x="1230" y="149" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#5C4400" text-anchor="middle" opacity="1">ProductoDeEscritura</text><text x="1230" y="170" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#7A5B00" text-anchor="middle" opacity="1" style="font-style:italic">hereda atributos de Producto</text><rect x="1460" y="120" width="300" height="70" rx="2" fill="#FFF2CC" stroke="#BF9000" stroke-width="2"/><text x="1610" y="149" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#5C4400" text-anchor="middle" opacity="1">ProductoDeOrganizacion</text><text x="1610" y="170" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="normal" fill="#7A5B00" text-anchor="middle" opacity="1" style="font-style:italic">hereda atributos de Producto</text><rect x="60" y="330" width="300" height="200" rx="2" fill="#E8F0FE" stroke="#1F4E79" stroke-width="2.2"/><text x="210" y="359" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0B2E4F" text-anchor="middle" opacity="1">Comprador</text><line x1="70" y1="369" x2="350" y2="369" stroke="#1F4E79" stroke-width="1"/><text x="74" y="394" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">nombreComprador : xsd:string</text><text x="74" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">correoComprador : xsd:string</text><rect x="460" y="330" width="300" height="200" rx="2" fill="#E8F0FE" stroke="#1F4E79" stroke-width="2.2"/><text x="610" y="359" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0B2E4F" text-anchor="middle" opacity="1">Pedido</text><line x1="470" y1="369" x2="750" y2="369" stroke="#1F4E79" stroke-width="1"/><text x="474" y="394" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">fechaPedido : xsd:dateTime</text><text x="474" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">totalPedido : xsd:integer</text><rect x="860" y="330" width="340" height="200" rx="2" fill="#E8F0FE" stroke="#1F4E79" stroke-width="2.2"/><text x="1030" y="359" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0B2E4F" text-anchor="middle" opacity="1">DetallePedido</text><line x1="870" y1="369" x2="1190" y2="369" stroke="#1F4E79" stroke-width="1"/><text x="874" y="394" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">cantidad : xsd:integer</text><text x="874" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">precioUnitarioCompra : xsd:integer</text><text x="874" y="442" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">subtotalLinea : xsd:integer (derivada)</text><rect x="1320" y="330" width="340" height="200" rx="2" fill="#E8F0FE" stroke="#1F4E79" stroke-width="2.2"/><text x="1490" y="359" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0B2E4F" text-anchor="middle" opacity="1">Producto</text><line x1="1330" y1="369" x2="1650" y2="369" stroke="#1F4E79" stroke-width="1"/><text x="1334" y="394" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">nombreProducto : xsd:string</text><text x="1334" y="418" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">descripcionProducto : xsd:string</text><text x="1334" y="442" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">precioActual : xsd:integer</text><line x1="360" y1="430" x2="460" y2="430" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="361.514" y="396.2" width="96.972" height="19.8" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="410" y="412" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.8" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">realizaPedido</text><rect x="374" y="439" width="10.379999999999999" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="376" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="start" opacity="1">1</text><rect x="420.48" y="439" width="29.52" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="448" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="end" opacity="1">0..*</text><line x1="760" y1="430" x2="860" y2="430" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="764.936" y="396.2" width="90.12800000000001" height="19.8" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="810" y="412" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.8" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">tieneDetalle</text><rect x="774" y="439" width="10.379999999999999" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="776" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="start" opacity="1">1</text><rect x="820.48" y="439" width="29.52" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="848" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="end" opacity="1">1..*</text><line x1="1200" y1="430" x2="1320" y2="430" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="1214.936" y="396.2" width="90.12800000000001" height="19.8" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1260" y="412" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.8" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">correspondeA</text><rect x="1214" y="439" width="29.52" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1216" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="start" opacity="1">0..*</text><rect x="1299.62" y="439" width="10.379999999999999" height="19" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1308" y="454" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#4B5563" text-anchor="end" opacity="1">1</text><line x1="1230" y1="190" x2="1400" y2="330" stroke="#BF9000" stroke-width="2.2" marker-end="url(#hollow)"/><rect x="1282.0240000000001" y="244.8" width="85.95199999999998" height="19.2" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1325" y="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" fill="#BF9000" text-anchor="middle" opacity="1">esSubclaseDe</text><line x1="1610" y1="190" x2="1560" y2="330" stroke="#BF9000" stroke-width="2.2" marker-end="url(#hollow)"/><rect x="1552.0240000000001" y="244.8" width="85.95199999999998" height="19.2" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1595" y="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="bold" fill="#BF9000" text-anchor="middle" opacity="1">esSubclaseDe</text><rect x="60" y="650" width="780" height="380" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="78" y="682" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Leyenda</text><rect x="80" y="695" width="140" height="32" rx="0" fill="#E8F0FE" stroke="#1F4E79" stroke-width="1.8"/><text x="150" y="716" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle" opacity="1">Producto</text><text x="260" y="710" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Clase</text><text x="260" y="728" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">rectángulo con nombre y atributos tipados</text><line x1="80" y1="762" x2="220" y2="762" stroke="#BF9000" stroke-width="2" marker-end="url(#hollow)"/><text x="260" y="760" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Subclase de</text><text x="260" y="778" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">la flecha hueca apunta a la superclase</text><line x1="80" y1="812" x2="220" y2="812" stroke="#1F2937" stroke-width="2" marker-end="url(#filled)"/><text x="260" y="810" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Propiedad de objeto</text><text x="260" y="828" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">enlace rotulado: dominio → rango; cardinalidades en los extremos</text><rect x="80" y="845" width="140" height="32" rx="0" fill="#E8F0FE" stroke="#1F4E79" stroke-width="1.8"/><text x="88" y="866" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">precio : xsd:integer</text><text x="260" y="860" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Propiedad de datos</text><text x="260" y="878" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">atributo dentro de la clase, con tipo xsd</text><line x1="80" y1="912" x2="220" y2="912" stroke="#6B7280" stroke-width="2" marker-end="url(#open)" stroke-dasharray="5 4"/><text x="260" y="910" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">instanciaDe</text><text x="260" y="928" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">pertenencia individuo → clase (página 2)</text><rect x="80" y="945" width="160" height="32" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 3"/><text x="90" y="966" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1F2937"><tspan text-decoration="underline">ana</tspan> : Comprador</text><text x="260" y="960" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.7" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Individuo</text><text x="260" y="978" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">nombre subrayado; clase después de «:»</text><rect x="880" y="650" width="860" height="380" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/><text x="898" y="681" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Decisiones y alcance</text><text x="898" y="708" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• Dos subclases justificadas por el catálogo: ProductoDeEscritura (Cuaderno, Bolígrafo,</text><text x="898" y="728" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  Resaltador, Agenda) y ProductoDeOrganizacion (Carpeta, Estuche). No se declaran disjuntas.</text><text x="898" y="748" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• Comprador se reifica como clase aunque SQLite guarde nombre y correo en pedidos.</text><text x="898" y="768" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  No se crea una tabla nueva: la ontología describe al agente, no solo dos columnas.</text><text x="898" y="788" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• precioUnitarioCompra es el precio congelado de la línea; precioActual es el precio vigente</text><text x="898" y="808" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  del catálogo. Si cambia el precio actual, el pedido histórico no se altera.</text><text x="898" y="828" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• totalPedido y subtotalLinea son valores derivados de las líneas; no son precios enviados</text><text x="898" y="848" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  por el cliente. La app los calcula con los precios de SQLite.</text><text x="898" y="868" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• La ontología describe significados y hechos; no valida formularios ni ejecuta inferencias.</text><text x="898" y="888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  Las reglas (cantidad &gt; 0, correo con @, al menos un ítem) viven en la aplicación.</text><text x="898" y="908" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• Alcance: catálogo, comprador, pedido y detalle. Fuera: pago, envío, inventario, cuentas,</text><text x="898" y="928" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  descuentos y reseñas.</text><text x="898" y="948" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• Cardinalidades: cada Pedido tiene 1..* DetallePedido y exactamente 1 Comprador; cada</text><text x="898" y="968" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  DetallePedido corresponde a exactamente 1 Producto.</text><text x="898" y="988" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• En los extremos, el número indica cuántas instancias de esa clase participan por instancia</text><text x="898" y="1008" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.1" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">  de la otra (p. ej., 1 comprador por pedido; 1..* detalles por pedido).</text><text x="1320" y="575" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.2" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1" style="font-style:italic">La jerarquía no crea tablas: las subclases son conceptos del dominio.</text>
</svg>
