"925" y1="420" x2="925" y2="405" stroke="#6B7280" stroke-width="1.6" marker-end="url(#open)" stroke-dasharray="6 4"/><line x1="1595" y1="350" x2="1595" y2="365" stroke="#6B7280" stroke-width="1.6" marker-end="url(#open)" stroke-dasharray="6 4"/><line x1="1595" y1="430" x2="1595" y2="415" stroke="#6B7280" stroke-width="1.6" marker-end="url(#open)" stroke-dasharray="6 4"/><line x1="1595" y1="820" x2="1595" y2="835" stroke="#6B7280" stroke-width="1.6" marker-end="url(#open)" stroke-dasharray="6 4"/><line x1="290" y1="335" x2="380" y2="335" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="285.76" y="294" width="98.47999999999999" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="335" y="310" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">realizaPedido</text><line x1="680" y1="300" x2="780" y2="260" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="684.24" y="264" width="91.52" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="730" y="280" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">tieneDetalle</text><line x1="680" y1="380" x2="780" y2="500" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="684.24" y="424" width="91.52" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="730" y="440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">tieneDetalle</text><line x1="1070" y1="260" x2="1420" y2="260" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="1199.24" y="232" width="91.52" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1245" y="248" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">correspondeA</text><line x1="1070" y1="500" x2="1420" y2="500" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><rect x="1199.24" y="472" width="91.52" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1245" y="488" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0B5394" text-anchor="middle" opacity="1">correspondeA</text><rect x="40" y="520" width="650" height="310" rx="4" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"/><text x="58" y="551" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Hechos declarados y consecuencia inferida</text><text x="58" y="578" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">Declarado (ABox):</text><text x="58" y="596.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• ana realizaPedido pedido001.</text><text x="58" y="615" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• pedido001 tieneDetalle detalle001 y detalle002.</text><text x="58" y="633.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• detalle001 correspondeA cuaderno001; detalle002 correspondeA boligrafo001.</text><text x="58" y="652" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">• Valores de datos: 2 × 12000 = 24000 y 1 × 2500 = 2500; total 26500.</text><text x="58" y="670.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1"></text><text x="58" y="689" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">Inferido por la jerarquía (TBox):</text><text x="58" y="707.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">ProductoDeEscritura es subclase de Producto  +  cuaderno001 : ProductoDeEscritura</text><text x="58" y="726" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">∴ cuaderno001 : Producto. Igual para boligrafo001 y carpeta001.</text><text x="58" y="744.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1"></text><text x="58" y="763" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">carpeta001 no se enlaza en pedido001: se incluye para mostrar la segunda</text><text x="58" y="781.5" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">subclase y responder la pregunta 3. El mínimo de seis individuos se cumple</text><text x="58" y="800" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.4" font-weight="normal" fill="#1F2937" text-anchor="start" opacity="1">con siete (1 comprador, 1 pedido, 2 detalles y 3 productos).</text><rect x="40" y="900" width="1340" height="160" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/><text x="58" y="930" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">Leyenda de la página</text><line x1="62" y1="966" x2="172" y2="966" stroke="#6B7280" stroke-width="1.6" marker-end="url(#open)" stroke-dasharray="6 4"/><text x="190" y="963" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">instanciaDe</text><text x="190" y="981" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">pertenencia del individuo a la clase</text><line x1="62" y1="1012" x2="172" y2="1012" stroke="#1F2937" stroke-width="2.1" marker-end="url(#filled)"/><text x="190" y="1009" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">propiedad de objeto</text><text x="190" y="1027" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">hecho declarado entre individuos</text><rect x="460" y="948" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 3"/><text x="472" y="970" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#1F2937"><tspan text-decoration="underline">ana</tspan> : Comprador</text><text x="658" y="963" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">individuo</text><text x="658" y="981" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">nombre subrayado; clase después de «:»</text><rect x="460" y="998" width="180" height="34" rx="3" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 3"/><text x="550" y="1020" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#374151" text-anchor="middle" opacity="1">«Clase» Producto</text><text x="658" y="1009" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12.3" font-weight="bold" fill="#1F2937" text-anchor="start" opacity="1">clase de referencia</text><text x="658" y="1027" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="10.6" font-weight="normal" fill="#4B5563" text-anchor="start" opacity="1">chip gris: solo indica la clase, no es un individuo</text>
