<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Carrito | La Libreta</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><a class="marca" href="/">La Libreta</a><nav aria-label="Principal"><a href="/">Catálogo</a><a href="/carrito">Carrito <span class="contador" id="contador">0</span></a><a href="/pedidos">Pedidos</a></nav></header>
  <main>
    <h1>Carrito</h1>
    <p id="estado" class="estado" role="status">Cargando carrito…</p>

    <section id="vista-carrito" hidden>
      <table class="tabla">
        <thead><tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead>
        <tbody id="filas"></tbody>
        <tfoot><tr><th colspan="3">Total provisional</th><th id="total" colspan="2"></th></tr></tfoot>
      </table>

      <form id="formulario" class="panel" novalidate>
        <h2>Datos del comprador</h2>
        <label>Nombre <input name="nombre" type="text" required autocomplete="name"></label>
        <label>Correo <input name="correo" type="email" required autocomplete="email"></label>
        <p id="error" class="mensaje error" role="alert" hidden></p>
        <button type="submit" id="enviar">Registrar pedido</button>
      </form>
    </section>

    <section id="confirmacion" class="panel exito" hidden aria-live="polite">
      <p class="eyebrow">PEDIDO REGISTRADO</p>
      <h2 id="conf-titulo"></h2>
      <ul id="conf-items"></ul>
      <p class="precio" id="conf-total"></p>
      <a class="boton" href="/pedidos">Ver pedidos</a>
      <a class="boton secundario" href="/">Seguir comprando</a>
    </section>

    <a id="volver" class="boton secundario" href="/" hidden>Ir al catálogo</a>
  </main>
  <footer>La Libreta · Papelería académica. Compra simulada sin cobro.</footer>
  <script src="/carrito-storage.js"></script>
  <script src="/carrito.js"></script>
</body>
</html>
